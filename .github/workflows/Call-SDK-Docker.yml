name: Call SDK Docker

on:
  workflow_call:
    inputs:
      cache:
        type: boolean
      feeds:
        type: boolean     
      out:
        type: boolean
      sdk:
        type: string  
      package:
        type: string
      version:
          type: string
     
jobs:
  jod_initial:
    name: Actions Build ${{ inputs.package }}
    runs-on: ubuntu-latest
    outputs:
      time: ${{steps.output_time.outputs.time}}
      matrix: ${{ steps.parse_arch.outputs.matrix }}
    steps: 
      - name: Checkout
        uses: actions/checkout@v4

      - name: output Time
        id: output_time
        run: |
          sudo timedatectl set-timezone "Asia/Shanghai"
          echo "time=$(date "+%Y.%m.%d_%H%M%S")" >> $GITHUB_OUTPUT
          
      - name: Parse arch from Makefile
        id: parse_arch
        run: |
          MAKEFILE="${{ inputs.package }}/Makefile"
          DEFAULT='["x86_64"]'

          if [ ! -f "$MAKEFILE" ]; then
            echo "::warning::Makefile not found at $MAKEFILE, fallback to default arch list"
            echo "matrix=$DEFAULT" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 1) DEPENDS:=@(aarch64||x86_64) => 架构约束(硬性要求), 按声明的架构编译
          #    优先于 PKGARCH:=all: 主包若限定架构, 子包的 PKGARCH:=all 不应收缩矩阵
          DEPS_LINE=$(grep -m1 'DEPENDS:=@(' "$MAKEFILE" || true)
          if [ -n "$DEPS_LINE" ]; then
            ARCHS=$(printf '%s' "$DEPS_LINE" | sed -E 's/.*@\((.*)\).*/\1/' | tr '|' '\n' | sed -E 's/[[:space:]]//g' | grep -v '^$')
            MATRIX="["
            COUNT=0
            for arch in $ARCHS; do
              case "$arch" in
                aarch64) sdk="aarch64_generic" ;;
                x86_64)  sdk="x86_64" ;;
                riscv64) sdk="riscv64_generic" ;;
                i386)    sdk="i386_pentium4" ;;
                mipsel)  sdk="mipsel_24kc" ;;
                mips)    sdk="mips_24kc" ;;
                *)       sdk="$arch" ;;
              esac
              MATRIX="$MATRIX\"$sdk\","
              COUNT=$((COUNT+1))
            done
            if [ "$COUNT" -gt 0 ]; then
              MATRIX="${MATRIX%,}]"
              echo "Parsed matrix from DEPENDS: $MATRIX"
              echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::DEPENDS has @() but no arch parsed from $MAKEFILE, fall through to PKGARCH check"
          fi

          # 2) PKGARCH:=all => 架构无关包, 只需在单架构上编译一次
          if grep -m1 -qE 'PKGARCH:=[[:space:]]*all' "$MAKEFILE"; then
            echo "Detected PKGARCH:=all (noarch), building on single arch: x86_64"
            echo 'matrix=["x86_64"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 3) 兜底: 默认架构列表
          echo "::warning::No @(arch) constraint and no PKGARCH:=all in $MAKEFILE, fallback to default arch list"
          echo "matrix=$DEFAULT" >> "$GITHUB_OUTPUT"

      - name: Delete GitHub Release
        uses: dev-drprasad/delete-tag-and-release@master
        with:
          tag_name: GitHub-Actions_${{ inputs.package }}
          delete_release: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        
      - name: Cleanup GitHub Cache
        if: (inputs.cache == true)
        run: |
          gh cache delete --all --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        
  jobs_build:
    name: Build ${{ matrix.arch }}-${{ matrix.sdk_version }}
    needs: jod_initial
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJson(needs.jod_initial.outputs.matrix) }}
        sdk_version:
          - openwrt-${{ inputs.Version }}
          #- SNAPSHOT
    env:
      BUILD_TIME: ${{ needs.jod_initial.outputs.time }}
      COMPRESSED_FILENAME: ${{ inputs.package }}-${{ matrix.sdk_version }}-${{ matrix.arch }}_${{ needs.jod_initial.outputs.time }}.tar.gz
      OUTPUT_DIR: ${{ inputs.package }}/Output/
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set Environment Variables
        run: |
          if [ "${{ inputs.out }}" == "true" ]; then
            echo "Buildout=sc" >> $GITHUB_ENV
          fi
          if [[ "${{ inputs.feeds }}" == "true"  || "${{ inputs.package }}" =~ "static" ]]; then
            echo "feeds=true" >> $GITHUB_ENV
          fi

      - name: Build Openwrt Packages
        if: inputs.sdk == 'Openwrt'
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.sdk_version }}
          FEEDNAME: packages_ci
          PACKAGES: ${{ inputs.package }}
          NO_DEFAULT_FEEDS: ${{ env.feeds }}
          NO_REFRESH_CHECK: true
          V: ${{ env.Buildout }}

      - name: Build Immortalwrt Packages
        if: inputs.sdk == 'Immortalwrt'
        uses: immortalwrt/gh-action-sdk@master
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.sdk_version }}
          FEEDNAME: packages_ci
          PACKAGES: ${{ inputs.package }}
          NO_DEFAULT_FEEDS: ${{ env.feeds }}
          NO_REFRESH_CHECK: true
          V: ${{ env.Buildout }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}-${{ matrix.sdk_version }}
          path: |
            bin/packages/${{ matrix.arch }}/packages_ci/*.[ia]pk
            bin/packages/riscv64_generic/packages_ci/*.[ia]pk

      - name: Create compress files
        id: compress_files
        continue-on-error: true
        run: |
          test -d ${{ env.OUTPUT_DIR }} || mkdir -p ${{ env.OUTPUT_DIR }}
          if [ "${{ matrix.arch }}" = "riscv64_riscv64" ] && [ "${{ matrix.sdk_version }}" = "SNAPSHOT" ]; then
            TARGET_PATH="bin/packages/riscv64_generic/packages_ci"
          else
            TARGET_PATH="bin/packages/${{ matrix.arch }}/packages_ci"
          fi
          if [ -d "$TARGET_PATH" ] && [ "$(ls -A $TARGET_PATH)" ]; then
            # 只执行一次tar命令，保留文件结构
            tar -zcf ${{ env.OUTPUT_DIR }}/${{ env.COMPRESSED_FILENAME }} -C $TARGET_PATH .
            echo "✅ 压缩文件成功：${{ env.OUTPUT_DIR }}/${{ env.COMPRESSED_FILENAME }}"
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "❌ 目标目录无文件：$TARGET_PATH"
            echo "status=failed" >> $GITHUB_OUTPUT
          fi
          
      - name: Upload as release assets
        if: steps.compress_files.outputs.status == 'success'
        uses: ncipollo/release-action@main
        with:
          tag: GitHub-Actions_${{ inputs.package }}
          name: ${{ inputs.package }}
          artifacts: ${{ env.OUTPUT_DIR }}/*
          body: |
            ## 编译信息
            - 编译时间：`${{ env.BUILD_TIME }}`
            - SDK版本：`${{ inputs.sdk }}`
            - 插件：`${{ inputs.package }}`
          allowUpdates: true
          removeArtifacts: false
          replacesArtifacts: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}